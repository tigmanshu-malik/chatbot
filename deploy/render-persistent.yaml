# Paid deployment: select this only after reviewing and approving Render's price.
# Same service names let an existing free presentation deployment be upgraded.
services:
  - type: web
    name: lyftr-chat-api
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    disk:
      name: chat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 26.13.1
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: sqlite:////var/data/app.db
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: DEMO_MODE
        value: "false"
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://lyftr-chat-web-0szr.onrender.com
      - key: CACHE_TTL_SECONDS
        value: "3600"
  - type: web
    name: lyftr-chat-web
    runtime: static
    buildCommand: npm run build:frontend
    staticPublishPath: ./dist/frontend
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 26.13.1
      - key: BACKEND_URL
        value: https://lyftr-chat-api-h1xd.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
