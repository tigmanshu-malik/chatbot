# Free presentation deployment. SQLite files are ephemeral on Render Free.
# For durable SQLite, review deploy/render-persistent.yaml and approve its paid plan.
services:
  - type: web
    name: lyftr-chat-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 26.13.1
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: sqlite:///backend/app.db
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: DEMO_MODE
        value: "false"
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: lyftr-chat-api
          envVarKey: RENDER_EXTERNAL_URL
  - type: web
    name: lyftr-chat-web
    runtime: static
    buildCommand: npm run build:frontend
    staticPublishPath: ./dist/frontend
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 26.13.1
      - key: BACKEND_URL
        fromService:
          type: web
          name: lyftr-chat-api
          envVarKey: PUBLIC_API_URL
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
